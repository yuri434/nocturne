plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
 namespace 'com.yuri.music'
 compileSdk 35
 defaultConfig { applicationId 'com.yuri.music.youtube'; minSdk 26; targetSdk 35; versionCode 20; versionName '0.7.4'; ndk { abiFilters 'arm64-v8a','x86_64' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
chaquopy { defaultConfig { version='3.12'; buildPython(System.getenv('YURI_BUILD_PYTHON') ?: 'python'); pip { install 'ytmusicapi==1.12.3'; install 'yt-dlp==2026.10.26' } } }
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
