plugins { id 'com.android.application' }
android {
 namespace 'com.yuri.music'
 compileSdk 35
 defaultConfig { applicationId (project.findProperty('nocturnePreviewUpdate') == 'true' ? 'com.yuri.music.noctune.preview' : 'com.yuri.music.youtube'); minSdk 26; targetSdk 35; versionCode 32; versionName '0.12.0'; ndk { abiFilters 'arm64-v8a','x86_64' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
